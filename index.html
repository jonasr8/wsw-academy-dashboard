<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>WSW Academy Dashboard 2027</title>
<style>
:root{--font-anthropic-sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--font-anthropic-serif:Georgia,"Times New Roman",serif;
--cds-gap-xs:4px;--cds-gap-sm:8px;--cds-gap-md:16px;--cds-gap-lg:20px;--cds-gap-xl:28px;--cds-pad-xs:4px;--cds-pad-sm:8px;--cds-pad-md:12px;--cds-pad-lg:18px;--cds-pad-xl:28px;--cds-radius:10px;
--cds-font-size-caption:12.5px;--cds-font-size-body:15px;--cds-font-size-heading:17px;--cds-font-size-title:30px;--cds-font-weight-medium:600;--cds-dur-slow:.3s;
--color-fg:#16181d;--color-fg-muted:#5f6672;--color-bg:#f6f6f7;--color-panel:#ffffff;--color-border-line:#e3e4e8;--color-ok:#15803d;--color-warn:#b45309;--color-bad:#b91c1c;
--cds-chart-grid:#eceef1;--cds-chart-muted:#a3a8b3;--cds-surface-popover:#ffffff;--cds-border:#d9dbe0;--cds-shadow-popover:0 6px 20px rgba(0,0,0,.12);--cds-text-secondary:#5f6672}
@media (prefers-color-scheme:dark){:root{--color-fg:#eceef1;--color-fg-muted:#a3a8b3;--color-bg:#121316;--color-panel:#1b1d22;--color-border-line:#2c2f36;--color-ok:#4ade80;--color-warn:#fbbf24;--color-bad:#f87171;
--cds-chart-grid:#2a2d33;--cds-chart-muted:#6b7280;--cds-surface-popover:#22252b;--cds-border:#363a42;--cds-text-secondary:#a3a8b3}}
html,body{margin:0;background:var(--color-bg);color:var(--color-fg)}
.wrap{padding:16px clamp(16px,3vw,32px) 40px}
.dash-skeleton{color:transparent;background:var(--cds-chart-grid);border-radius:4px}
.wa-foot{font-family:var(--font-anthropic-sans);font-size:var(--cds-font-size-caption);color:var(--color-fg-muted);text-align:center;margin-top:8px}


.wa{--wsw-red:#B5122B;--wsw-red-ink:#fff;--wsw-gold:#C9A227;--wsw-black:#111;display:grid;gap:var(--cds-gap-xl);font-family:var(--font-anthropic-sans);font-variant-numeric:tabular-nums;max-width:1200px;margin-inline:auto}
.wa-hero{display:flex;gap:var(--cds-gap-lg);align-items:center;background:var(--wsw-red);color:var(--wsw-red-ink);border-radius:var(--cds-radius);padding:var(--cds-pad-lg) var(--cds-pad-xl);flex-wrap:wrap;position:relative;overflow:hidden}
.wa-hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;border:28px solid rgba(0,0,0,.14)}
.wa-hero img{width:58px;height:auto;flex:none;position:relative;z-index:1}
.wa-hero-txt{flex:1;min-width:0;position:relative;z-index:1;display:grid;gap:var(--cds-gap-xs)}
.wa-eyebrow{font-size:var(--cds-font-size-caption);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.wa-hero h1{font-family:var(--font-anthropic-serif);font-weight:400;font-size:var(--cds-font-size-title);margin:0;line-height:1.15;text-wrap:balance}
.wa-note-cell{color:var(--color-fg-muted);font-style:italic}
.wa-upd{font-weight:700;margin-top:4px}
.wa-take{margin:0;font-size:var(--cds-font-size-body);max-width:70ch;opacity:.95}
.wa-season{position:relative;z-index:1;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:var(--cds-pad-xs) var(--cds-pad-md);font-size:var(--cds-font-size-caption);letter-spacing:.06em;white-space:nowrap}
.wa-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10.5rem),1fr));gap:var(--cds-gap-md)}
.wa-kpi{background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:var(--cds-pad-md) var(--cds-pad-lg);display:grid;gap:var(--cds-gap-xs);align-content:start}
.wa-kpi.lead{border-top:3px solid var(--wsw-red)}
.wa-kpi .lab{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted)}
.wa-kpi .num{font-family:var(--font-anthropic-serif);font-weight:400;font-size:var(--cds-font-size-title);line-height:1.1}
.wa-kpi .sub{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted)}
.wa-sec{display:grid;gap:var(--cds-gap-md)}
.wa-sec>h2{font-size:var(--cds-font-size-heading);font-weight:var(--cds-font-weight-medium);margin:0;display:flex;align-items:center;gap:var(--cds-gap-sm)}
.wa-sec>h2::before{content:"";width:10px;height:10px;background:var(--wsw-red);transform:rotate(45deg);flex:none}
.wa-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:var(--cds-gap-md)}
.wa-card{background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:var(--cds-pad-lg);display:grid;gap:var(--cds-gap-sm);align-content:start;min-width:0;position:relative}
.wa-card h3{font-size:var(--cds-font-size-heading);font-weight:var(--cds-font-weight-medium);margin:0}
.wa-note{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted);margin:0}
.wa-stack{display:flex;height:34px;border-radius:6px;overflow:hidden;gap:2px;min-height:34px}
.wa-stack>div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:var(--cds-font-size-caption);font-weight:600;min-width:0;overflow:hidden;white-space:nowrap}
.wa-legend{display:flex;flex-wrap:wrap;gap:var(--cds-gap-sm) var(--cds-gap-lg);font-size:var(--cds-font-size-caption)}
.wa-legend span{display:inline-flex;align-items:center;gap:6px}
.wa-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.wa-bars{display:grid;gap:10px;min-height:40px}
.wa-bar{display:grid;grid-template-columns:minmax(4.5rem,7.5rem) 1fr auto;gap:var(--cds-gap-sm);align-items:center;font-size:var(--cds-font-size-caption)}
.wa-bar .track{height:18px;background:var(--cds-chart-grid);border-radius:4px;position:relative;overflow:hidden}
.wa-bar .fill{position:absolute;inset:0 auto 0 0;border-radius:4px}
.wa-bar .val{min-width:3.5rem;text-align:right;font-weight:600}
.wa-bar .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wa-tools{display:flex;gap:var(--cds-gap-sm);flex-wrap:wrap;align-items:center}
.wa-tools input{flex:1;min-width:0;max-width:20rem;padding:6px 10px;border:1px solid var(--color-border-line);border-radius:6px;background:var(--color-bg);color:var(--color-fg);font:inherit;font-size:var(--cds-font-size-caption)}
.wa-chip{border:1px solid var(--color-border-line);background:transparent;color:var(--color-fg);border-radius:999px;padding:4px 10px;font:inherit;font-size:var(--cds-font-size-caption);cursor:pointer}
.wa-chip[aria-pressed="true"]{background:var(--wsw-red);border-color:var(--wsw-red);color:#fff}
.wa-tbox{max-height:26rem;overflow:auto;border:1px solid var(--color-border-line);border-radius:6px}
.wa-t{width:100%;border-collapse:collapse;font-size:var(--cds-font-size-caption)}
.wa-t th{position:sticky;top:0;background:var(--color-panel);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--color-border-line);white-space:nowrap}
.wa-t th button{all:unset;cursor:pointer}
.wa-t th button:focus-visible{outline:2px solid var(--wsw-red);outline-offset:2px}
.wa-t td{padding:7px 10px;border-bottom:1px solid var(--color-border-line);vertical-align:top}
.wa-t td.n,.wa-t th.n{text-align:right}
.wa-pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid currentColor}
.p-ws{color:var(--wsw-red)}.p-other{color:var(--color-fg-muted)}
.s-done{color:var(--color-ok)}.s-prog{color:var(--color-warn)}.s-pend{color:var(--color-bad)}
.wa-hide-sm{}
@media (max-width:640px){.wa-hide-sm{display:none}}
.wa-prog{height:12px;border-radius:999px;background:var(--cds-chart-grid);overflow:hidden;display:flex}
.wa-prog>div{height:100%}
.wa-tip{position:absolute;pointer-events:none;background:var(--cds-surface-popover);border:1px solid var(--cds-border);border-radius:var(--cds-radius);box-shadow:var(--cds-shadow-popover);padding:var(--cds-pad-xs) var(--cds-pad-sm);font-size:var(--cds-font-size-caption);z-index:5;max-width:16rem}
.wa-tip b{display:block;color:var(--cds-text-secondary);font-weight:400}
.wa-def{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted);border-left:3px solid var(--wsw-gold);padding-left:var(--cds-pad-sm);margin:0}
.wa-onb{display:grid;gap:var(--cds-gap-md)}
.wa-onb-row{display:grid;grid-template-columns:4.5rem repeat(3,minmax(0,1fr));gap:var(--cds-gap-md);align-items:center}
.wa-onb-row.head{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted)}
.wa-onb-row .sq{font-weight:600}
.wa-onb-row .sq small{display:block;font-weight:400;color:var(--color-fg-muted);font-size:11px}
.wa-m{display:grid;gap:4px;font-size:var(--cds-font-size-caption);min-width:0}
.wa-m .t{height:10px;border-radius:999px;background:var(--cds-chart-grid);overflow:hidden}
.wa-m .t>div{height:100%;background:var(--wsw-red);border-radius:999px}
.wa-m .na{color:var(--color-fg-muted);font-style:italic}
@media (max-width:520px){.wa-onb-row{grid-template-columns:3.5rem repeat(3,minmax(0,1fr));gap:var(--cds-gap-sm)}}
[data-dash-source-state=empty]{color:transparent}
[data-dash-source-state=refreshing]{opacity:.5;transition:opacity var(--cds-dur-slow)}
.wa-fail{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--color-fg-muted);font-size:var(--cds-font-size-caption);min-height:40px}
.wa-fail::before{content:"";width:.375rem;height:.375rem;border-radius:50%;background:var(--color-bad)}
.wa-tabs{display:flex;gap:var(--cds-gap-sm);flex-wrap:wrap;border-bottom:1px solid var(--color-border-line);padding-bottom:var(--cds-pad-sm)}
.wa-tab{border:1px solid var(--color-border-line);background:transparent;color:var(--color-fg);border-radius:999px;padding:8px 18px;font:inherit;font-size:var(--cds-font-size-body);font-weight:var(--cds-font-weight-medium);cursor:pointer}
.wa-tab[aria-selected="true"]{background:var(--wsw-red);border-color:var(--wsw-red);color:#fff}
.wa-tab:focus-visible{outline:2px solid var(--wsw-red);outline-offset:2px}
.wa-page{display:grid;gap:var(--cds-gap-xl)}
.wa-page[hidden]{display:none}
.wa-lede{margin:0;font-size:var(--cds-font-size-body);max-width:80ch}
</style>

dash.calc('c_map',{inputs:['wsw_map'],title:'Suburbs on the WSW map',description:'Number of suburbs named on the WSW catchment map.',fn:(wsw_map)=>[{suburbs:wsw_map.length}]});

function academyCalcs(a){
  const P=a.p, L=a.prog;
  dash.calc(P+'_rows',{inputs:[a.sub,'wsw_map'],title:`${a.acad}: players with Western Sydney flag`,description:'Each squad and suburb row, marked Western Sydney when the suburb is on the WSW catchment map, with its zone.',
    fn:(suburbs,wsw_map)=>{const z=new Map(wsw_map.map(m=>[m.suburb.toLowerCase(),m.zone]));return suburbs.map(r=>{const zone=z.get(r.suburb.toLowerCase());return {...r,players:Number(r.players),zone:zone||'',region:zone?'Western Sydney':(r.area==='Sydney'?'Rest of Sydney':r.area)};});}});
  dash.calc(P+'_kpi',{inputs:[P+'_rows'],title:`${L} headline figures`,description:'Total players, Western Sydney players and share, suburbs and council areas.',
    fn:(rows)=>{const p=d3.sum(rows,r=>r.players);const ws=d3.sum(rows.filter(r=>r.region==='Western Sydney'),r=>r.players);
      return [{players:p,ws_players:ws,ws_share:p?ws/p:0,suburbs:new Set(rows.map(r=>r.suburb)).size,lgas:new Set(rows.map(r=>r.lga)).size}];}});
  dash.calc(P+'_region',{inputs:[P+'_rows'],title:`${a.acad}: players by region`,description:'Players and share of all players per region.',
    fn:(rows)=>{const p=d3.sum(rows,r=>r.players);return d3.rollups(rows,v=>d3.sum(v,r=>r.players),r=>r.region).map(([region,players])=>({region,players,share:players/p}));}});
  dash.calc(P+'_ws_squad',{inputs:[P+'_rows'],title:`${a.acad}: Western Sydney share by squad`,description:'For each squad, players living in a WSW map suburb divided by the squad’s players on the list.',
    fn:(rows)=>d3.rollups(rows,v=>{const t=d3.sum(v,r=>r.players);const w=d3.sum(v.filter(r=>r.region==='Western Sydney'),r=>r.players);return {players:t,ws:w,share:t?w/t:0};},r=>r.squad).map(([squad,o])=>({squad,...o})).sort((x,y)=>x.squad.localeCompare(y.squad))});
  dash.calc(P+'_suburb',{inputs:[P+'_rows'],title:`${a.acad}: players per suburb`,description:'Players per suburb across all squads, and their share of all players.',
    fn:(rows)=>{const p=d3.sum(rows,r=>r.players);return d3.rollups(rows,v=>({postcode:v[0].postcode,lga:v[0].lga,zone:v[0].zone,region:v[0].region,players:d3.sum(v,r=>r.players)}),r=>r.suburb).map(([suburb,o])=>({suburb,...o,share:o.players/p}));}});
  dash.calc(P+'_zone',{inputs:[P+'_rows'],title:`${a.acad}: players per WSW zone`,description:'Western Sydney players per catchment zone, and share of all players.',
    fn:(rows)=>{const p=d3.sum(rows,r=>r.players);return d3.rollups(rows.filter(r=>r.zone),v=>d3.sum(v,r=>r.players),r=>r.zone).map(([zone,players])=>({zone,players,share:players/p})).sort((x,y)=>y.players-x.players||x.zone.localeCompare(y.zone));}});
  dash.calc(P+'_onb',{inputs:[a.onb],title:`${a.acad}: onboarding progress by squad`,description:'Per squad: players, and the share done for Onboarding Form, TeamApp and VEO. A blank TeamApp or VEO count means not checked yet.',
    fn:(onboarding)=>onboarding.map(r=>{const p=Number(r.players);const f=k=>r[k]===''||r[k]==null?null:Number(r[k]);const o={squad:r.squad,players:p,form:f('onboarding_form'),teamapp:f('teamapp'),veo:f('veo')};
      o.form_pct=o.form==null?null:o.form/p;o.teamapp_pct=o.teamapp==null?null:o.teamapp/p;o.veo_pct=o.veo==null?null:o.veo/p;return o;})});
  dash.calc(P+'_onb_tot',{inputs:[P+'_onb'],title:`${a.acad}: onboarding totals`,description:'All squads together.',
    fn:(onb)=>{const p=d3.sum(onb,r=>r.players);const s=k=>onb.some(r=>r[k]==null)?null:d3.sum(onb,r=>r[k]);const form=s('form'),teamapp=s('teamapp'),veo=s('veo');
      return [{players:p,form,teamapp,veo,form_pct:form==null?null:form/p,teamapp_pct:teamapp==null?null:teamapp/p,veo_pct:veo==null?null:veo/p,outstanding:form==null?null:p-form}];}});
  dash.calc(P+'_programs',{inputs:[a.sq],title:`${a.acad}: players per program`,description:'Sum of squad sizes per program.',
    fn:(squads)=>d3.rollups(squads,v=>d3.sum(v,r=>Number(r.players)),r=>r.program).map(([program,players])=>({program,players}))});
}
academyCalcs(ACADEMIES.boys);
academyCalcs(ACADEMIES.girls);
dash.calc('b_tasks',{inputs:['tasks'],title:'Boys task progress',description:'Tasks marked Boys or Both, counted by status; open means not Done.',
  fn:(tasks)=>{const t=tasks.filter(x=>x.area!=='Girls');const c=s=>t.filter(x=>x.status===s).length;const done=c('Done');return [{total:t.length,done,open:t.length-done,in_progress:c('In progress'),pending:c('Pending'),pct_done:t.length?done/t.length:0}];}});
dash.calc('g_tasks',{inputs:['tasks'],title:'Girls task progress',description:'Tasks marked Girls or Both, counted by status; open means not Done.',
  fn:(tasks)=>{const t=tasks.filter(x=>x.area!=='Boys');const c=s=>t.filter(x=>x.status===s).length;const done=c('Done');return [{total:t.length,done,open:t.length-done,in_progress:c('In progress'),pending:c('Pending'),pct_done:t.length?done/t.length:0}];}});

const pct=d3.format('.1%'), pct0=d3.format('.0%');
const regColor=(r)=>({'Western Sydney':'var(--wsw-red)','Rest of Sydney':'var(--cds-chart-muted)','Regional NSW':'var(--wsw-gold)','Interstate / overseas':'var(--color-fg-muted)'}[r]||'var(--cds-chart-muted)');
const setNum=(root,sel,v)=>root.querySelectorAll(sel).forEach(el=>{el.textContent=v;el.classList.remove('dash-skeleton');});
const fail=(el)=>{el.replaceChildren();const d=document.createElement('div');d.className='wa-fail';d.textContent='Failed to load';el.appendChild(d);};

/* tooltip */
function tip(card){let t=card.querySelector('.wa-tip');if(!t){t=document.createElement('div');t.className='wa-tip';t.hidden=true;card.appendChild(t);}return t;}
function bindTip(el,card,head,body){const t=tip(card);
  el.addEventListener('mousemove',(e)=>{const b=card.getBoundingClientRect();t.replaceChildren();const h=document.createElement('b');h.textContent=head;t.append(h,document.createTextNode(body));t.hidden=false;
    let x=e.clientX-b.left+12,y=e.clientY-b.top+12;const w=t.offsetWidth;if(x+w>b.width-4)x=Math.max(4,e.clientX-b.left-w-12);t.style.left=x+'px';t.style.top=y+'px';});
  el.addEventListener('mouseleave',()=>{t.hidden=true;});}

function bars(host,rows,{label,value,fmt,max,color,tipHead,tipBody}){
  host.replaceChildren();
  const card=host.closest('.wa-card');
  rows.forEach(r=>{const row=document.createElement('div');row.className='wa-bar';
    const nm=document.createElement('span');nm.className='name';nm.textContent=label(r);
    const tr=document.createElement('div');tr.className='track';const f=document.createElement('div');f.className='fill';f.style.width=(max?Math.max(0,value(r)/max*100):0)+'%';f.style.background=color(r);tr.appendChild(f);
    const v=document.createElement('span');v.className='val';v.textContent=fmt(r);
    row.append(nm,tr,v);host.appendChild(row);bindTip(row,card,tipHead(r),tipBody(r));});
}

/* build a page from the template the first time it is shown */
const state={};
function build(a){
  const host=document.getElementById(a.id);
  if(state[a.id])return;
  const enc=(s)=>encodeURIComponent(s);
  host.innerHTML=document.getElementById('tpl-academy').innerHTML
    .replaceAll('__P__',a.p).replaceAll('__ID__',a.id).replaceAll('__SQ__',a.sq)
    .replaceAll('__PROG__',a.prog).replaceAll('__ACAD__',a.acad)
    .replaceAll('__NPL_LABEL__',a.nplLabel).replaceAll('__NPL_SUB__',a.nplSub).replaceAll('__NPL_ENC__',enc(a.npl))
    .replaceAll('__ONB_TITLE__',a.onbTitle).replaceAll('__ONB_NOTE__',a.onbNote)
    .replaceAll('__SUB_NOTE__',a.subNote).replaceAll('__SL_NOTE__',a.id==='boys'?'Goalkeepers first, then A–Z by first name. U13–U18 squads and positions from Anel’s tracking sheet; NPL from the NPL squad list. DOB from the Jotform (blank until the family submits).':'Goalkeepers first, then A–Z by first name. Squads from the 2026-27 Girls squad list; positions and DOB from the 2027 squad tabs (DOB from the Jotform where missing).').replaceAll('__SQ_NOTE__',a.sqNote);
  const s=state[a.id]={subSort:{k:'players',dir:-1},subQ:'',subWS:false,taskF:'all'};
  host.querySelectorAll('.x-sub-table th button').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k;s.subSort={k,dir:s.subSort.k===k?-s.subSort.dir:(k==='players'||k==='share'?-1:1)};drawSuburbs(a);}));
  host.querySelector('.x-sub-q').addEventListener('input',(e)=>{s.subQ=e.target.value.trim().toLowerCase();drawSuburbs(a);});
  const wsBtn=host.querySelector('.x-sub-ws');wsBtn.addEventListener('click',()=>{s.subWS=!s.subWS;wsBtn.setAttribute('aria-pressed',String(s.subWS));drawSuburbs(a);});
  host.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{s.taskF=b.dataset.f;host.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));drawTasks(a);}));
}

function drawSuburbs(a){
  const host=document.getElementById(a.id),s=state[a.id];
  const d=dash.data(a.p+'_suburb');const tb=host.querySelector('.x-sub-table tbody');tb.replaceChildren();
  if(d.status!=='ok')return;
  let rows=d.data.filter(r=>!s.subWS||r.region===WS).filter(r=>!s.subQ||[r.suburb,r.postcode,r.lga,r.zone,r.region].join(' ').toLowerCase().includes(s.subQ));
  const {k,dir}=s.subSort;rows=rows.slice().sort((x,y)=>{const p=x[k],q=y[k];const c=(typeof p==='number')?p-q:String(p).localeCompare(String(q));return c*dir||x.suburb.localeCompare(y.suburb);});
  host.querySelectorAll('.x-sub-table th').forEach(th=>{const b=th.querySelector('button');th.setAttribute('aria-sort',b&&b.dataset.k===k?(dir>0?'ascending':'descending'):'none');});
  rows.forEach(r=>{const tr=document.createElement('tr');tr.dataset.key=r.suburb;
    const td=(t,c)=>{const e=document.createElement('td');if(c)e.className=c;e.textContent=t;return e;};
    const reg=document.createElement('td');const p=document.createElement('span');p.className='wa-pill '+(r.region===WS?'p-ws':'p-other');p.textContent=r.region;reg.appendChild(p);
    tr.append(td(r.suburb),td(r.postcode,'wa-hide-sm'),td(r.zone,'wa-hide-sm'),reg,td(String(r.players),'n'),td(pct(r.share),'n'));tb.appendChild(tr);});
}

function drawTasks(a){
  const host=document.getElementById(a.id),s=state[a.id];
  const d=dash.data('tasks');const tb=host.querySelector('.x-task-table tbody');tb.replaceChildren();
  if(d.status!=='ok')return;
  const order={'Pending':0,'In progress':1,'Done':2};
  const rows=d.data.filter(t=>t.area!==a.area).filter(t=>s.taskF==='all'||(s.taskF==='open'?t.status!=='Done':t.status===s.taskF)).slice().sort((x,y)=>(order[x.status]??3)-(order[y.status]??3)||String(x.due||'9').localeCompare(String(y.due||'9')));
  const fmtD=(v)=>v?d3.timeFormat('%-d %b %Y')(new Date(v+'T00:00:00')):'';
  rows.forEach(t=>{const tr=document.createElement('tr');tr.dataset.key=t.id;
    const td=(x,c)=>{const e=document.createElement('td');if(c)e.className=c;e.textContent=x;return e;};
    const st=document.createElement('td');const p=document.createElement('span');p.className='wa-pill '+(t.status==='Done'?'s-done':t.status==='In progress'?'s-prog':'s-pend');p.textContent=t.status;st.appendChild(p);
    tr.append(td(t.task),td(t.area,'wa-hide-sm'),td(t.owner),st,td(fmtD(t.due),'wa-hide-sm'),td(t.note,'wa-hide-sm'));tb.appendChild(tr);});
}

function draw(a){
  const root=document.getElementById(a.id), P=a.p;
  const k=dash.data(P+'_kpi'), lede=root.querySelector('.wa-lede');
  if(k.status==='ok'&&k.data[0]){const r=k.data[0];
    setNum(root,`[data-source="${P}_kpi"][data-field="ws_share"]`,pct(r.ws_share));
    setNum(root,`[data-source="${P}_kpi"][data-field="ws_players"]`,String(r.ws_players));
    setNum(root,`[data-source="${P}_kpi"][data-field="players"]`,String(r.players));
    setNum(root,`[data-source="${P}_kpi"][data-field="suburbs"]`,String(r.suburbs));
    setNum(root,`[data-source="${P}_kpi"][data-field="lgas"]`,String(r.lgas));
    lede.textContent=`${pct(r.ws_share)} of the ${r.players} ${a.prog} players onboarded for 2027 live in Western Sydney, spread across ${r.suburbs} suburbs.`;
  } else if(k.status==='error'||k.status==='connect'){lede.textContent='Figures did not load.';}

  const pg=dash.data(P+'_programs');if(pg.status==='ok'){const r=pg.data.find(x=>x.program===a.npl);if(r)setNum(root,`[data-source="${P}_programs"]`,String(r.players));}

  const ob=dash.data(P+'_onb'),og=root.querySelector('.x-onb-grid'),os=root.querySelector('.x-onb-sum'),ot=dash.data(P+'_onb_tot');
  if(ot.status==='ok'&&ot.data[0]){const r=ot.data[0];setNum(root,`[data-source="${P}_onb_tot"][data-field="form_pct"]`,r.form_pct==null?'—':pct0(r.form_pct));setNum(root,`[data-source="${P}_onb_tot"][data-field="form"]`,String(r.form));setNum(root,`[data-source="${P}_onb_tot"][data-field="players"]`,String(r.players));
    os.textContent=`${r.form} of ${r.players} squad players have submitted the Onboarding Form (${pct0(r.form_pct)}); ${r.outstanding} still to come. TeamApp: ${r.teamapp==null?'not checked yet':pct0(r.teamapp_pct)}. VEO: ${r.veo==null?'not checked yet':pct0(r.veo_pct)}.`;}
  if(ob.status==='ok'){og.replaceChildren();const card=og.closest('.wa-card');
    const head=document.createElement('div');head.className='wa-onb-row head';['Squad','Onboarding Form','TeamApp','VEO'].forEach(x=>{const s=document.createElement('span');s.textContent=x;head.appendChild(s);});og.appendChild(head);
    ob.data.forEach(r=>{const row=document.createElement('div');row.className='wa-onb-row';
      const sq=document.createElement('span');sq.className='sq';sq.textContent=r.squad;const sm=document.createElement('small');sm.textContent=`${r.players} players`;sq.appendChild(sm);row.appendChild(sq);
      [['Onboarding Form','form'],['TeamApp','teamapp'],['VEO','veo']].forEach(([lab,key])=>{const m=document.createElement('div');m.className='wa-m';
        if(r[key]==null){const na=document.createElement('span');na.className='na';na.textContent='Not checked yet';const tt=document.createElement('div');tt.className='t';m.append(na,tt);}
        else{const v=document.createElement('span');v.textContent=`${pct0(r[key+'_pct'])} · ${r[key]}/${r.players}`;const tt=document.createElement('div');tt.className='t';const fl=document.createElement('div');fl.style.width=(r[key+'_pct']*100)+'%';if(r[key+'_pct']>=1)fl.style.background='var(--color-ok)';tt.appendChild(fl);m.append(v,tt);
          bindTip(m,card,`${r.squad} · ${lab}`,`${r[key]} of ${r.players} done · ${r.players-r[key]} outstanding`);}
        row.appendChild(m);});
      og.appendChild(row);});}
  else if(ob.status==='error')fail(og);

  const rg=dash.data(P+'_region'),stack=root.querySelector('.x-region-stack'),leg=root.querySelector('.x-region-legend');
  if(rg.status==='ok'){const rows=rg.data.slice().sort((x,y)=>REG_ORDER.indexOf(x.region)-REG_ORDER.indexOf(y.region));
    stack.replaceChildren();leg.replaceChildren();const card=stack.closest('.wa-card');
    rows.forEach(r=>{const s=document.createElement('div');s.style.flex=String(r.players);s.style.background=regColor(r.region);s.textContent=r.share>=.08?pct0(r.share):'';stack.appendChild(s);
      bindTip(s,card,r.region,`${r.players} players · ${pct(r.share)}`);
      const l=document.createElement('span');const i=document.createElement('i');i.style.background=regColor(r.region);l.append(i,document.createTextNode(`${r.region} · ${r.players} (${pct(r.share)})`));leg.appendChild(l);});
  } else if(rg.status==='error')fail(stack);

  const ws=dash.data(P+'_ws_squad'),wsh=root.querySelector('.x-ws-squad');
  if(ws.status==='ok')bars(wsh,ws.data,{label:r=>r.squad,value:r=>r.share,max:1,fmt:r=>pct0(r.share),color:()=>'var(--wsw-red)',tipHead:r=>r.squad,tipBody:r=>`${r.ws} of ${r.players} players · ${pct(r.share)}`});
  else if(ws.status==='error')fail(wsh);

  const zn=dash.data(P+'_zone'),znh=root.querySelector('.x-zone-bars');
  if(zn.status==='ok'){const rows=zn.data;if(!rows.length){znh.replaceChildren();const e=document.createElement('p');e.className='wa-note';e.textContent='No onboarded players in a WSW zone yet.';znh.appendChild(e);}
    else bars(znh,rows,{label:r=>r.zone,value:r=>r.players,max:d3.max(rows,r=>r.players)||1,fmt:r=>`${r.players} · ${pct0(r.share)}`,color:()=>'var(--wsw-red)',tipHead:r=>r.zone,tipBody:r=>`${r.players} players · ${pct(r.share)} of all ${a.prog} players`});}
  else if(zn.status==='error')fail(znh);
  const cm=dash.data('c_map');if(cm.status==='ok'&&cm.data[0])setNum(root,'[data-source="c_map"]',String(cm.data[0].suburbs));

  drawSuburbs(a);

  const sq=dash.data(a.sq),sqh=root.querySelector('.x-squad-bars');
  if(sq.status==='ok'){const rows=sq.data.map(r=>({...r,players:n(r.players)}));const mx=d3.max(rows,r=>r.players);
    const youth=(r)=>/ (BYL|GYL)$/.test(r.program);
    bars(sqh,rows,{label:r=>`${r.program.replace(/^(Boys|Girls) /,'')} ${r.squad}`,value:r=>r.players,max:mx,fmt:r=>String(r.players),color:r=>youth(r)?'var(--wsw-red)':'var(--color-fg)',tipHead:r=>`${r.program} · ${r.squad}`,tipBody:r=>`${r.players} players${r.goalkeepers?` incl. ${r.goalkeepers} GK`:''} · ${r.status}`});}
  else if(sq.status==='error')fail(sqh);

  const tk=dash.data(P+'_tasks'),prog=root.querySelector('.x-task-prog'),sum=root.querySelector('.x-task-sum'),tl=root.querySelector('.x-task-legend');
  if(tk.status==='ok'&&tk.data[0]){const r=tk.data[0];
    setNum(root,`[data-source="${P}_tasks"][data-field="open"]`,String(r.open));setNum(root,`[data-source="${P}_tasks"][data-field="done"]`,String(r.done));setNum(root,`[data-source="${P}_tasks"][data-field="total"]`,String(r.total));
    sum.textContent=`${pct0(r.pct_done)} complete: ${r.done} done, ${r.in_progress} in progress, ${r.pending} pending.`;
    prog.replaceChildren();tl.replaceChildren();
    [['Done',r.done,'var(--color-ok)'],['In progress',r.in_progress,'var(--color-warn)'],['Pending',r.pending,'var(--color-bad)']].forEach(([lab,v,c])=>{const s=document.createElement('div');s.style.flex=String(v);s.style.background=c;prog.appendChild(s);
      const l=document.createElement('span');const i=document.createElement('i');i.style.background=c;l.append(i,document.createTextNode(`${lab} ${v}`));tl.appendChild(l);});}
  drawTasks(a);
}

/* tabs */
let current='boys';
function show(id,link){
  if(!ACADEMIES[id])return;
  current=id;
  document.querySelectorAll('.wa-tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.page===id)));
  Object.keys(ACADEMIES).forEach(k=>{document.getElementById(k).hidden=(k!==id);});
  build(ACADEMIES[id]);
  draw(ACADEMIES[id]);
  if(link!==false)dash.setLink(id);
}
document.querySelectorAll('.wa-tab').forEach(t=>t.addEventListener('click',()=>show(t.dataset.page)));

const startHash=location.hash.slice(1);
const startPage=startHash.startsWith('girls')?'girls':'boys';
build(ACADEMIES[startPage]);
show(startPage,false);

dash.onData(()=>{ if(state[current])draw(ACADEMIES[current]); });

if(startHash){const el=document.getElementById(startHash);if(el&&el.id!==startPage)el.scrollIntoView();}
</script>

<script>
dash.onData(()=>{
  const d=dash.data('todo'),tb=document.querySelector('#todo-table tbody'),sum=document.getElementById('todo-sum');
  tb.replaceChildren();
  if(d.status!=='ok'){sum.textContent='—';return;}
  const act=d.data.filter(r=>String(r.status||'').trim().toLowerCase()!=='done')
    .sort((a,b)=>((b.priority==='High')-(a.priority==='High'))||(Number(a.id)-Number(b.id)));
  sum.textContent=act.length?`${act.length} active item${act.length===1?'':'s'}`:'Nothing outstanding';
  const fmt=v=>{const t=String(v||'').slice(0,10);const p=t.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:t;};
  act.forEach(r=>{const tr=document.createElement('tr');tr.dataset.key=String(r.id);
    [[r.item,''],[r.priority==='High'?'★ High':'Normal',''],[fmt(r.added),'wa-hide-sm'],[r.source,'wa-hide-sm']].forEach(([v,c])=>{const td=document.createElement('td');td.textContent=v||'';if(c)td.className=c;tr.appendChild(td);});
    if(r.priority==='High')tr.style.fontWeight='600';
    tb.appendChild(tr);});
});
</script>

<!--MISSING-SCRIPT-START-->
<script>
(function(){
  const MF={boys:'all',girls:'all'};
  const ORDER=['U13','U14','U15','U16','U18','U23'];
  function drawMissing(){
    ['boys','girls'].forEach(id=>{
      const host=document.getElementById(id); if(!host)return;
      const tb=host.querySelector('.x-miss-table tbody'); if(!tb)return;
      if(!host.dataset.mb){host.dataset.mb='1';
        host.querySelectorAll('[data-mf]').forEach(b=>b.addEventListener('click',()=>{MF[id]=b.dataset.mf;
          host.querySelectorAll('[data-mf]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));drawMissing();}));}
      const sum=host.querySelector('.x-miss-sum'),sq=host.querySelector('.x-miss-squads');
      tb.replaceChildren();
      const d=dash.data('missing');
      if(d.status!=='ok'){sum.textContent='—';sq.textContent='—';return;}
      const prog=id==='boys'?'Boys':'Girls';
      const all=d.data.filter(r=>r.program===prog);
      const nJ=all.filter(r=>r.jotform==='Missing').length,nT=all.filter(r=>r.teamapp==='Missing').length;
      sum.textContent=all.length?`${nJ} still to submit the Jotform · ${nT} not on TeamApp`:'Everyone on the squad lists has done both';
      const by={};all.forEach(r=>{const b=by[r.squad]||(by[r.squad]={j:0,t:0});if(r.jotform==='Missing')b.j++;if(r.teamapp==='Missing')b.t++;});
      sq.textContent=Object.keys(by).sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b)).map(k=>`${k}: ${by[k].j} Jotform, ${by[k].t} TeamApp`).join(' · ')||'';
      const f=MF[id];
      all.filter(r=>f==='all'||r[f]==='Missing').forEach(r=>{
        const tr=document.createElement('tr');tr.dataset.key=encodeURIComponent(r.program)+','+encodeURIComponent(r.player);
        [[r.squad,''],[r.player,''],[r.jotform,r.jotform==='Missing'?'s-pend':'s-done'],[r.teamapp,r.teamapp==='Missing'?'s-pend':'s-done'],[r.note||'','wa-note-cell']]
          .forEach(([v,c])=>{const td=document.createElement('td');td.textContent=v||'';if(c)td.className=c;tr.appendChild(td);});
        tb.appendChild(tr);});
    });
  }
  dash.onData(drawMissing);
  document.querySelectorAll('.wa-tab').forEach(t=>t.addEventListener('click',()=>setTimeout(drawMissing,0)));
})();
</script>
<!--MISSING-SCRIPT-END-->
